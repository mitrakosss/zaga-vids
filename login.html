<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Zaga - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>

<div class="loading-screen" id="loading">
  <div class="spinner"></div>
</div>

<div class="login-container" id="loginBox">
  <img src="img/logo.png" class="logo" alt="Zaga Logo">
  <h2>Είσοδος</h2>

  <input type="text" id="username" placeholder="Username" autocomplete="username" autocapitalize="none">

  <div class="input-with-icon">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button class="icon-btn" id="togglePwd" type="button" aria-label="Show password">
      <!-- eye icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5.5Z"/>
      </svg>
    </button>
  </div>

  <button id="loginBtn">Σύνδεση</button>
  <button id="registerBtn" class="btn-secondary">Request Access</button>

  <div id="msg" class="info-message" style="display:none;"></div>
  <div id="err" class="error-message" style="display:none;">Λάθος στοιχεία ή δεν έχεις εγκριθεί ακόμα.</div>
</div>

<script src="js/app.js"></script>
<script>
  window.addEventListener("load", async () => {
    document.getElementById("loading").style.display = "none";
    document.getElementById("loginBox").style.opacity = 1;

    // auto seed admin one-time (safe to call repeatedly)
    try { await fetch("/api/seed-admin"); } catch {}

    // if already logged in, go videos
    try {
      const me = await ZagaAPI.me();
      if (me.ok) window.location.href = "videos.html";
    } catch {}
  });

  // eye toggle
  document.getElementById("togglePwd").addEventListener("click", () => {
    const input = document.getElementById("password");
    input.type = (input.type === "password") ? "text" : "password";
  });

  document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
  });

  document.getElementById("loginBtn").onclick = async () => {
    document.getElementById("err").style.display = "none";
    document.getElementById("msg").style.display = "none";

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const res = await ZagaAPI.login(username, password);
    if (res.ok) window.location.href = "videos.html";
    else document.getElementById("err").style.display = "block";
  };

  document.getElementById("registerBtn").onclick = async () => {
    document.getElementById("err").style.display = "none";
    const msg = document.getElementById("msg");
    msg.style.display = "none";

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const res = await ZagaAPI.register(username, password, "");
    msg.style.display = "block";
    msg.textContent = res.ok
      ? "✅ Αίτημα στάλθηκε! Περιμένεις έγκριση από admin."
      : ("❌ " + (res.message || "Δεν έγινε."));
  };
</script>

</body>
</html>
