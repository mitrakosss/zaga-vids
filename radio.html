<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Zaga Radio</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
  color: white;
  overflow: hidden;
}

.bg {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: url('img/logo.png') center/cover no-repeat;
  filter: blur(30px) brightness(0.4);
  transform: scale(1.2);
  z-index: 0;
}

.app {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.top {
  text-align: center;
  padding: 20px;
}

.now {
  font-size: 18px;
  opacity: 0.8;
}

.station {
  font-size: 22px;
  font-weight: bold;
}

canvas {
  width: 100%;
  height: 120px;
}

.controls {
  padding: 20px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #00e5ff;
  font-size: 18px;
}

</style>
</head>

<body>

<div class="bg" id="bg"></div>

<div class="app">

  <div class="top">
    <div class="station" id="station">Zaga Radio</div>
    <div class="now" id="now">Loading...</div>
  </div>

  <canvas id="vis"></canvas>

  <div class="controls">
    <button onclick="toggle()">▶ Play / Pause</button>
  </div>

</div>

<audio id="audio" crossorigin="anonymous"></audio>

<script src="js/radio-pro.js"></script>

</body>
</html>
