<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Zaga Radio</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/style.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
}

/* ===== TOPBAR (same vibe as videos page) ===== */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: rgba(17,17,17,0.95);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  border-bottom: 1px solid #222;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
  letter-spacing: 0.5px;
}

.brand span {
  font-weight: normal;
  opacity: 0.6;
}

/* ===== BUTTON ===== */
.btn {
  background: #1f1f1f;
  color: white;
  padding: 8px 14px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 14px;
  transition: 0.2s;
  border: 1px solid #2a2a2a;
}

.btn:hover {
  background: #2a2a2a;
}

/* ===== PAGE ===== */
.page {
  padding: 18px;
}

/* ===== GRID ===== */
.radio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 15px;
}

/* ===== CARD ===== */
.card {
  background: #151515;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.25s;
  border: 1px solid #222;
}

.card:hover {
  transform: translateY(-3px);
  background: #202020;
}

.card-inner {
  display: flex;
  align-items: center;
  gap: 10px;
}

.card img {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  object-fit: cover;
  border: 1px solid #333;
}

/* ===== PLAYER ===== */
.player {
  margin-top: 25px;
  background: #111;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #222;
}

.station {
  font-size: 18px;
  font-weight: bold;
}

.now {
  opacity: 0.6;
  font-size: 13px;
  margin-bottom: 10px;
}

/* ===== VISUALISER ===== */
canvas {
  width: 100%;
  height: 90px;
  background: #000;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 1px solid #222;
}

audio {
  width: 100%;
}
</style>

</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

  <div class="brand">
    📻 ZagaTV <span>Radio</span>
  </div>

  <div style="display:flex;gap:10px;align-items:center;">

    <!-- 🔥 BUTTON TO VIDEOS -->
    <a class="btn" href="videos.html">🎬 Videos</a>

    <div style="opacity:0.5;font-size:13px;">Live</div>

  </div>

</div>

<!-- PAGE -->
<div class="page">

  <h2 style="margin:10px 0;">Live Stations</h2>

  <div class="radio-grid" id="radioGrid"></div>

  <div class="player">
    <div class="station" id="stationName">Select station</div>
    <div class="now" id="nowPlaying">—</div>

    <canvas id="vis"></canvas>

    <audio id="audio" controls></audio>
  </div>

</div>

<script src="js/radio.js"></script>
</body>
</html>
