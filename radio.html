<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Zaga Radio</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: white;
  font-family: "Century Gothic", Arial, sans-serif;
  overflow-x: hidden;
}

/* BACKGROUND */
.bg {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(35px) brightness(0.35);
  z-index: -1;
}

/* TOPBAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
}

.btn {
  background: #1f1f1f;
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  text-decoration: none;
  font-size: 14px;
  border: 1px solid #2a2a2a;
}

.btn:hover {
  background: #2a2a2a;
}

/* CENTER PLAYER */
.player {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 30px;
  text-align: center;
}

.cover {
  width: 220px;
  height: 220px;
  border-radius: 20px;
  object-fit: cover;
  box-shadow: 0 0 30px rgba(0,229,255,0.3);
}

.station {
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
}

.now {
  opacity: 0.6;
  font-size: 13px;
  margin-top: 4px;
}

/* PLAY BUTTON */
.play-btn {
  margin-top: 15px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: none;
  background: #00e5ff;
  color: #000;
  font-size: 20px;
  cursor: pointer;
}

/* VISUALISER */
canvas {
  width: 90%;
  max-width: 500px;
  height: 90px;
  margin-top: 20px;
}

/* STATIONS GRID CENTER */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  padding: 30px;
  max-width: 800px;
  margin: 0 auto;
}

.card {
  background: #111;
  padding: 10px;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-3px);
  background: #1a1a1a;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

/* TOP BUTTON RIGHT */
.top-right {
  display: flex;
  gap: 10px;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<!-- TOP -->
<div class="topbar">
  <div>📻 Zaga Radio</div>

  <div class="top-right">
    <a class="btn" href="videos.html">🎬 Videos</a>
  </div>
</div>

<!-- PLAYER -->
<div class="player">

  <img id="cover" class="cover" src="img/zaga.png">

  <div class="station" id="stationName">Select station</div>
  <div class="now" id="nowPlaying">—</div>

  <button id="playBtn" class="play-btn">▶</button>

  <canvas id="vis"></canvas>

  <audio id="audio"></audio>
</div>

<!-- STATIONS -->
<div class="container">
  <div class="grid" id="radioGrid"></div>
</div>
  
<script src="js/radio.js"></script>
</body>
</html>
