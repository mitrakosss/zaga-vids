<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Zaga Radio</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b0b;
  color: white;
  overflow-x: hidden;
}

/* BACKGROUND BLUR */
.bg {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(40px) brightness(0.4);
  z-index: -1;
  transition: 0.5s;
}

/* TOPBAR */
.topbar {
  display: flex;
  justify-content: space-between;
  padding: 12px 16px;
}

.btn {
  background: #1f1f1f;
  padding: 6px 12px;
  border-radius: 8px;
  text-decoration: none;
  color: white;
}

/* PLAYER */
.player {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 40px;
}

/* ALBUM */
.cover {
  width: 220px;
  height: 220px;
  border-radius: 20px;
  object-fit: cover;
  box-shadow: 0 0 40px rgba(0,229,255,0.4);
}

/* TEXT */
.station {
  margin-top: 20px;
  font-size: 20px;
  font-weight: bold;
}

.now {
  opacity: 0.6;
  font-size: 14px;
}

/* VISUALISER */
canvas {
  width: 90%;
  max-width: 500px;
  height: 100px;
  margin-top: 20px;
}

/* AUDIO */
audio {
  width: 90%;
  max-width: 500px;
  margin-top: 15px;
}

/* GRID */
.grid {
  margin-top: 40px;
  padding: 15px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}

.card {
  background: #111;
  padding: 10px;
  border-radius: 12px;
  cursor: pointer;
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<div class="topbar">
  <div>📻 Zaga Radio</div>
  <a class="btn" href="videos.html">🎬 Videos</a>
</div>

<div class="player">

  <img id="cover" class="cover" src="img/zaga.png">

  <div class="station" id="stationName">Select station</div>
  <div class="now" id="nowPlaying">—</div>

  <canvas id="vis"></canvas>

  <audio id="audio" controls></audio>

</div>

<div class="grid" id="radioGrid"></div>

<script src="js/radio.js"></script>
</body>
</html>
