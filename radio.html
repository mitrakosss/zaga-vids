<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Zaga Radio</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Century Gothic;
  background: #0b0b0b;
  color: white;
  overflow-x: hidden;
}

/* BACKGROUND */
.bg {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(35px) brightness(0.4);
  z-index: -1;
}

/* TOP */
.topbar {
  display: flex;
  justify-content: space-between;
  padding: 12px 16px;
}

/* PLAYER */
.player {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 40px;
}

.cover {
  width: 200px;
  height: 200px;
  border-radius: 20px;
  object-fit: cover;
  box-shadow: 0 0 30px rgba(0,229,255,0.4);
}

/* TEXT */
.station {
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
}

.now {
  opacity: 0.6;
  font-size: 13px;
}

/* PLAY BUTTON */
.play-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: none;
  background: #00e5ff;
  color: #000;
  font-size: 20px;
  margin-top: 15px;
  cursor: pointer;
}

/* VISUALISER */
canvas {
  width: 90%;
  max-width: 500px;
  height: 100px;
  margin-top: 20px;
}

/* GRID */
.grid {
  margin-top: 40px;
  padding: 15px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}

.card {
  background: #111;
  padding: 10px;
  border-radius: 12px;
  cursor: pointer;
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

/* PROGRESS */
.progress {
  width: 90%;
  max-width: 500px;
  height: 4px;
  background: #222;
  border-radius: 10px;
  margin-top: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: #00e5ff;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<div class="topbar">
  <div>📻 Zaga Radio</div>
</div>

<div class="player">

  <img id="cover" class="cover" src="img/zaga.png">

  <div class="station" id="stationName">Select station</div>
  <div class="now" id="nowPlaying">—</div>

  <button id="playBtn" class="play-btn">▶</button>

  <canvas id="vis"></canvas>

  <div class="progress">
    <div class="bar" id="progressBar"></div>
  </div>

  <audio id="audio"></audio>

</div>

<div class="grid" id="radioGrid"></div>

<script src="js/radio.js"></script>
</body>
</html>
