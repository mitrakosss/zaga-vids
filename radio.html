<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Zaga Radio</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/style.css">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b0b;
  color: white;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: #111;
  position: sticky;
  top: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
}

.brand span {
  font-weight: normal;
  opacity: 0.7;
}

.page {
  padding: 15px;
}

.radio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  margin-top: 15px;
}

.card {
  background: #1a1a1a;
  padding: 14px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  background: #2a2a2a;
}

.player {
  margin-top: 25px;
  background: #111;
  padding: 15px;
  border-radius: 12px;
}

.now {
  font-size: 16px;
  opacity: 0.8;
  margin-bottom: 6px;
}

.station {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

canvas {
  width: 100%;
  height: 90px;
  background: black;
  border-radius: 8px;
  margin-bottom: 10px;
}

audio {
  width: 100%;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">
    📻 ZagaTV <span>Radio</span>
  </div>

  <div>Live</div>
</div>

<div class="page">

  <h2>Live Radio</h2>

  <div class="radio-grid" id="radioGrid"></div>

  <div class="player">
    <div class="station" id="stationName">Select station</div>
    <div class="now" id="nowPlaying">—</div>

    <canvas id="vis"></canvas>

    <audio id="audio" controls></audio>
  </div>

</div>

<script src="js/radio.js"></script>
</body>
</html>
